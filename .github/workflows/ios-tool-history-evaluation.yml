name: Evaluate iOS Persisted Tool History

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-tool-history-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate-tool-history:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RUN_REAL_TOOL_HISTORY_EVALUATION: "1"
      PERSONALDEEPSEEK_RUN_LIVE_RESEARCH_EVALS: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - name: Require evaluation secret
        run: test -n "$DEEPSEEK_API_KEY"
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Select Simulator
        run: |
          set -euo pipefail
          destination_id="$(xcrun simctl list devices available | sed -nE '/iPhone/s/.*\(([0-9A-Fa-f-]{36})\) \((Booted|Shutdown)\).*/\1/p' | sed -n '1p')"
          test -n "$destination_id"
          echo "SIMULATOR_ID=$destination_id" >> "$GITHUB_ENV"
      - name: Build tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PersonalDeepSeek.xcodeproj -scheme PersonalDeepSeek -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/ToolHistoryDerivedData" build-for-testing \
            | tee "$RUNNER_TEMP/tool-history-build.log"
      - name: Inject evaluation environment
        run: |
          set -euo pipefail
          xctestrun="$(find "$RUNNER_TEMP/ToolHistoryDerivedData/Build/Products" -name '*.xctestrun' -type f | sed -n '1p')"
          python3 - "$xctestrun" <<'PY'
          import os, plistlib, sys
          path = sys.argv[1]
          with open(path, "rb") as source: document = plistlib.load(source)
          count = 0
          def visit(value):
              global count
              if isinstance(value, dict):
                  if "TestBundlePath" in value:
                      env = value.setdefault("EnvironmentVariables", {})
                      env["RUN_REAL_TOOL_HISTORY_EVALUATION"] = "1"
                      env["PERSONALDEEPSEEK_RUN_LIVE_RESEARCH_EVALS"] = "1"
                      env["DEEPSEEK_API_KEY"] = os.environ["DEEPSEEK_API_KEY"]
                      env["TOOL_HISTORY_REPORT_DIR"] = os.environ["RUNNER_TEMP"] + "/tool-history-report"
                      count += 1
                  for child in value.values(): visit(child)
              elif isinstance(value, list):
                  for child in value: visit(child)
          visit(document)
          if count == 0: raise SystemExit("No XCTest configuration found")
          with open(path, "wb") as destination: plistlib.dump(document, destination)
          PY
          echo "XCTESTRUN_PATH=$xctestrun" >> "$GITHUB_ENV"
      - name: Run real DeepSeek evaluation
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/tool-history-report"
          xcodebuild -xctestrun "$XCTESTRUN_PATH" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:PersonalDeepSeekTests/ToolHistoryRealEvaluationTests/testPersistedToolHistoryBehaviorAgainstRealDeepSeek \
            test-without-building | tee "$RUNNER_TEMP/tool-history-evaluation.log"
      - name: Run live research token calibration
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -xctestrun "$XCTESTRUN_PATH" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:PersonalDeepSeekTests/ResearchLiveCalibrationTests/testOptInResearchSynthesisAndTokenCalibration \
            test-without-building | tee "$RUNNER_TEMP/research-token-calibration.log"
      - name: Collect report
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/tool-history-report"
          cp "$RUNNER_TEMP/tool-history-build.log" "$RUNNER_TEMP/tool-history-report/" 2>/dev/null || true
          cp "$RUNNER_TEMP/tool-history-evaluation.log" "$RUNNER_TEMP/tool-history-report/" 2>/dev/null || true
          cp "$RUNNER_TEMP/research-token-calibration.log" "$RUNNER_TEMP/tool-history-report/" 2>/dev/null || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-history-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/tool-history-report
          if-no-files-found: error
          retention-days: 14
