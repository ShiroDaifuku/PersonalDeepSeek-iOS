name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned device build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run unit tests
        working-directory: ios
        run: |
          set -euo pipefail
          destination_id="$(xcrun simctl list devices available \
            | sed -nE '/iPhone/s/.*\(([0-9A-Fa-f-]{36})\) \((Booted|Shutdown)\).*/\1/p' \
            | sed -n '1p')"
          test -n "$destination_id"
          xcodebuild \
            -project PersonalDeepSeek.xcodeproj \
            -scheme PersonalDeepSeek \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$destination_id" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            test | tee "$RUNNER_TEMP/xctest.log"

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PersonalDeepSeek.xcodeproj \
            -scheme PersonalDeepSeek \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/PersonalDeepSeek.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$app" "$RUNNER_TEMP/package/Payload/PersonalDeepSeek.app"
          cd "$RUNNER_TEMP/package"
          zip -qry "$GITHUB_WORKSPACE/PersonalDeepSeek-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 PersonalDeepSeek-unsigned.ipa > PersonalDeepSeek-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PersonalDeepSeek-unsigned-${{ github.run_number }}
          path: |
            PersonalDeepSeek-unsigned.ipa
            PersonalDeepSeek-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xctest.log
          if-no-files-found: ignore
          retention-days: 7
