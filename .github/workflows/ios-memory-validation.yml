name: Validate iOS Memory Step 1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-memory-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-memory:
    name: Build and test on iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Print environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Verify Memory sources are in generated targets
        working-directory: ios
        run: |
          set -euo pipefail
          project_file="PersonalDeepSeek.xcodeproj/project.pbxproj"
          for source in MemoryModels.swift MemoryStore.swift MemoryService.swift MemoryStoreTests.swift; do
            grep -q "$source" "$project_file"
          done

      - name: Show schemes and select Simulator
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project PersonalDeepSeek.xcodeproj -list
          xcodebuild \
            -project PersonalDeepSeek.xcodeproj \
            -scheme PersonalDeepSeek \
            -showdestinations
          xcrun simctl list devices available
          destination_id="$(xcrun simctl list devices available \
            | sed -nE '/iPhone/s/.*\(([0-9A-Fa-f-]{36})\) \((Booted|Shutdown)\).*/\1/p' \
            | sed -n '1p')"
          test -n "$destination_id"
          destination_name="$(xcrun simctl list devices available \
            | grep "$destination_id" \
            | sed -E 's/^[[:space:]]*([^()]*) \(.*/\1/' \
            | sed -n '1p')"
          echo "SIMULATOR_ID=$destination_id" >> "$GITHUB_ENV"
          echo "Selected Simulator: $destination_name ($destination_id)"

      - name: Build for testing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PersonalDeepSeek.xcodeproj \
            -scheme PersonalDeepSeek \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/MemoryValidationDerivedData" \
            build-for-testing \
            | tee "$RUNNER_TEMP/memory-build.log"

      - name: Run XCTest
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PersonalDeepSeek.xcodeproj \
            -scheme PersonalDeepSeek \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/MemoryValidationDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MemoryValidation.xcresult" \
            test-without-building \
            | tee "$RUNNER_TEMP/memory-tests.log"

      - name: Run embedding provider evaluation
        working-directory: ios
        run: |
          set -euo pipefail
          xctestrun="$(find "$RUNNER_TEMP/MemoryValidationDerivedData/Build/Products" -name '*.xctestrun' -type f | sed -n '1p')"
          test -n "$xctestrun"
          python3 - "$xctestrun" <<'PY'
          import plistlib
          import sys

          path = sys.argv[1]
          with open(path, "rb") as source:
              document = plistlib.load(source)
          injected = 0
          def visit(value):
              global injected
              if isinstance(value, dict):
                  if "TestBundlePath" in value:
                      environment = value.setdefault("EnvironmentVariables", {})
                      environment["RUN_MEMORY_PROVIDER_EVALUATION"] = "1"
                      environment["REQUEST_CONTEXTUAL_ASSETS"] = "1"
                      injected += 1
                  for child in value.values():
                      visit(child)
              elif isinstance(value, list):
                  for child in value:
                      visit(child)
          visit(document)
          if injected == 0:
              raise SystemExit("No XCTest configuration found")
          with open(path, "wb") as destination:
              plistlib.dump(document, destination)
          PY
          xcodebuild \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:PersonalDeepSeekTests/MemoryEmbeddingProviderEvaluationTests/testEmbeddingProvidersAgainstMultilingualBenchmark \
            test-without-building \
            | tee "$RUNNER_TEMP/memory-provider-evaluation.log"

      - name: Collect provider evaluation report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/memory-provider-evaluation"
          simulator_root="$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_ID/data/Containers/Data/Application"
          find "$simulator_root" -type f \
            \( -name 'memory-provider-evaluation.json' -o -name 'memory-provider-evaluation.md' \) \
            -exec cp {} "$RUNNER_TEMP/memory-provider-evaluation/" \; 2>/dev/null || true
          cp "$RUNNER_TEMP/memory-provider-evaluation.log" "$RUNNER_TEMP/memory-provider-evaluation/" 2>/dev/null || true

      - name: Upload provider evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-provider-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/memory-provider-evaluation
          if-no-files-found: warn
          retention-days: 14

      - name: Print test summary and Memory warnings
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/MemoryValidation.xcresult" ]]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/MemoryValidation.xcresult" || true
          fi
          echo "Memory-related compiler diagnostics:"
          grep -hE 'Memory(Models|Store|Service|StoreTests)\.swift:.*(warning|error):' \
            "$RUNNER_TEMP/memory-build.log" \
            "$RUNNER_TEMP/memory-tests.log" 2>/dev/null || echo "none"
