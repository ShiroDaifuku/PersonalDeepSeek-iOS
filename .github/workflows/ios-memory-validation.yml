name: Validate iOS Memory Step 1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-memory-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-research-step-1:
    name: Deep Research Step 1.5 Apple Gate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Print environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate pre-Step-3 SwiftData migration fixture
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p Tests/Resources "$RUNNER_TEMP/step3-fixture-generator"
          xcrun swiftc -parse-as-library -module-name PersonalDeepSeek Validation/GeneratePreStep3MemoryStore.swift -o "$RUNNER_TEMP/step3-fixture-generator/generate"
          "$RUNNER_TEMP/step3-fixture-generator/generate" "$PWD/Tests/Resources/pre-step3.store"
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select Simulator
        run: |
          destination_id="$(xcrun simctl list devices available | sed -nE '/iPhone/s/.*\(([0-9A-Fa-f-]{36})\) \((Booted|Shutdown)\).*/\1/p' | sed -n '1p')"
          test -n "$destination_id"
          echo "SIMULATOR_ID=$destination_id" >> "$GITHUB_ENV"
      - name: Build App and Test targets
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PersonalDeepSeek.xcodeproj -scheme PersonalDeepSeek -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/ResearchValidationDerivedData" build-for-testing | tee "$RUNNER_TEMP/research-build.log"
      - name: Run LocalResearchTests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PersonalDeepSeek.xcodeproj -scheme PersonalDeepSeek -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/ResearchValidationDerivedData" -resultBundlePath "$RUNNER_TEMP/LocalResearchTests.xcresult" -only-testing:PersonalDeepSeekTests/LocalResearchTests test-without-building | tee "$RUNNER_TEMP/local-research-tests.log"
      - name: Run all iOS unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PersonalDeepSeek.xcodeproj -scheme PersonalDeepSeek -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/ResearchValidationDerivedData" -resultBundlePath "$RUNNER_TEMP/AllTests.xcresult" test-without-building | tee "$RUNNER_TEMP/all-tests.log"
      - name: Enable networking smoke environment
        run: |
          xctestrun="$(find "$RUNNER_TEMP/ResearchValidationDerivedData/Build/Products" -name '*.xctestrun' -type f | sed -n '1p')"
          test -n "$xctestrun"
          python3 - "$xctestrun" <<'PY'
          import plistlib, sys
          path = sys.argv[1]
          with open(path, 'rb') as source: document = plistlib.load(source)
          injected = 0
          def visit(value):
              global injected
              if isinstance(value, dict):
                  if 'TestBundlePath' in value:
                      value.setdefault('EnvironmentVariables', {})['RUN_RESEARCH_NETWORK_SMOKE'] = '1'
                      injected += 1
                  for child in value.values(): visit(child)
              elif isinstance(value, list):
                  for child in value: visit(child)
          visit(document)
          if not injected: raise SystemExit('No XCTest configuration found')
          with open(path, 'wb') as destination: plistlib.dump(document, destination)
          PY
          echo "XCTESTRUN=$xctestrun" >> "$GITHUB_ENV"
      - name: Run real public networking smoke
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -xctestrun "$XCTESTRUN" -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath "$RUNNER_TEMP/ResearchSmoke.xcresult" -only-testing:PersonalDeepSeekTests/LocalResearchTests/testRealPublicNetworkingSmokeWhenEnabled test-without-building | tee "$RUNNER_TEMP/research-smoke.log"
      - name: Print summaries and warnings
        if: always()
        run: |
          for result in "$RUNNER_TEMP/LocalResearchTests.xcresult" "$RUNNER_TEMP/AllTests.xcresult" "$RUNNER_TEMP/ResearchSmoke.xcresult"; do
            if [[ -d "$result" ]]; then xcrun xcresulttool get test-results summary --path "$result" || true; fi
          done
          echo "Compiler diagnostics:"
          grep -E 'warning:|error:' "$RUNNER_TEMP/research-build.log" || echo none