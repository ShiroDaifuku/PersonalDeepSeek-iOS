name: PersonalDeepSeek
options:
  bundleIdPrefix: local.personal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  PersonalDeepSeek:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Resources]
      - path: Core
      - path: Features
      - path: App/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.personal.deepseek
        PRODUCT_NAME: PersonalDeepSeek
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 13
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App/PersonalDeepSeek.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DeepSeek Personal
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: 用于拍摄要交给 DeepSeek 分析的图片。
        NSPhotoLibraryUsageDescription: 用于选择要交给 DeepSeek 分析的图片。
        NSAlarmKitUsageDescription: 用于给你创建的定时任务安排设备强提醒。
        NSSupportsLiveActivities: true
    dependencies:
      - target: PersonalDeepSeekWidget
    scheme:
      testTargets: [PersonalDeepSeekTests]
  PersonalDeepSeekTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PersonalDeepSeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.personal.deepseek.tests
        GENERATE_INFOPLIST_FILE: YES
  PersonalDeepSeekWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Core/SystemShared
      - Core/AppGroupSnapshotStore.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: DeepSeek Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.personal.deepseek.widgets
        PRODUCT_NAME: PersonalDeepSeekWidget
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widget/PersonalDeepSeekWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
